<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="てびき">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>てびき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2C2C2A;--ink2:#5F5E5A;--ink3:#888780;--ink4:#D3D1C7;
  --paper:#F9F7F2;--paper2:#F1EFE8;--paper3:#E8E4DA;
  --accent:#0F6E56;--accent2:#1D9E75;--accent-light:#E1F5EE;
  --warm:#BA7517;--warm-light:#FAEEDA;
  --coral:#993C1D;--coral-light:#FAECE7;--danger:#A32D2D;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,20px);
}
html,body{height:100%;overflow:hidden;background:var(--paper)}
body{font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);display:flex;flex-direction:column;max-width:430px;margin:0 auto}

/* ── TOPBAR ── */
.topbar{background:var(--paper);border-bottom:1px solid var(--paper3);padding:calc(var(--safe-top)+10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Shippori Mincho',serif;font-size:19px;letter-spacing:.06em;color:var(--ink)}
.logo-mark{color:var(--accent);font-size:22px;margin-right:2px}
.save-toast{font-size:11px;color:var(--accent);opacity:0;transition:opacity .5s;user-select:none}
.save-toast.on{opacity:1}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--paper2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.icon-btn:active{background:var(--paper3)}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.user-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.user-chip button{padding:4px 10px;border-radius:20px;border:1px solid var(--paper3);background:var(--paper2);font-size:11px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink2)}
.user-chip button:hover{border-color:var(--coral);color:var(--danger)}

/* ── SCREENS ── */
.screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden;pointer-events:none;overflow:hidden}
.screen.active{visibility:visible;pointer-events:all}

/* ── AUTH SCREEN ── */
.auth-wrap{flex:1;overflow-y:auto;padding:32px 24px;display:flex;flex-direction:column;gap:24px}
.auth-logo{text-align:center;font-family:'Shippori Mincho',serif;font-size:28px;color:var(--ink)}
.auth-logo span{color:var(--accent);font-size:32px;margin-right:4px}
.auth-logo small{display:block;font-size:13px;color:var(--ink3);margin-top:4px;font-family:'Zen Kaku Gothic New',sans-serif}
.auth-tabs{display:flex;border-bottom:1px solid var(--paper3);gap:0}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:14px;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.auth-tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form.hidden{display:none}
.field-lbl{font-size:12px;color:var(--ink3);margin-bottom:3px}
.field-inp{width:100%;padding:11px 14px;border:1px solid var(--paper3);border-radius:10px;font-size:15px;font-family:'Zen Kaku Gothic New',sans-serif;background:var(--paper2);color:var(--ink);outline:none}
.field-inp:focus{border-color:var(--accent2);background:var(--paper)}
.auth-btn{padding:13px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:15px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;width:100%;transition:background .15s}
.auth-btn:hover{background:var(--accent2)}
.auth-btn:disabled{background:var(--ink4);cursor:default}
.auth-err{font-size:12px;color:var(--danger);min-height:16px;text-align:center}
.auth-ok{font-size:12px;color:var(--accent);min-height:16px;text-align:center}

/* ── HOME ── */
.home-hero{padding:22px 20px 14px;flex-shrink:0}
.home-greet{font-size:12px;color:var(--ink3);margin-bottom:4px;letter-spacing:.04em}
.home-title{font-family:'Shippori Mincho',serif;font-size:26px;line-height:1.3}
.home-title em{color:var(--accent);font-style:normal}
.new-btn{margin:4px 18px 4px;padding:14px 18px;background:var(--accent);color:#fff;border:none;border-radius:18px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:12px;width:calc(100% - 36px);transition:background .15s;flex-shrink:0}
.new-btn:active{background:var(--accent2)}
.new-btn-plus{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;line-height:1}
.new-btn-sub{font-size:11px;opacity:.75;margin-top:2px}
.section-lbl{font-size:11px;color:var(--ink3);letter-spacing:.1em;padding:18px 20px 8px;text-transform:uppercase;flex-shrink:0}
.manual-list{padding:0 15px 10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.mc{background:var(--paper);border:1px solid var(--paper3);border-radius:16px;padding:13px 15px 13px 19px;cursor:pointer;position:relative;overflow:hidden;transition:background .15s}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);border-radius:4px 0 0 4px}
.mc.c1::before{background:var(--warm)}.mc.c2::before{background:var(--coral)}
.mc:active{background:var(--accent-light)}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.mc-title{font-size:14px;font-weight:500;color:var(--ink);line-height:1.4;flex:1}
.mc-del{width:24px;height:24px;border-radius:50%;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink4);font-size:16px;line-height:1;transition:all .15s;margin-top:-2px}
.mc-del:hover{background:var(--coral-light);color:var(--danger)}
.mc-meta{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap;align-items:center}
.mc-pill{background:var(--paper2);border-radius:20px;padding:2px 8px;font-size:10px;color:var(--ink2)}
.mc-date{font-size:10px;color:var(--ink3)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink3);font-size:14px;line-height:1.8;text-align:center;padding:20px}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.3}

/* ── EDITOR ── */
.ed-header{padding:12px 15px 10px;border-bottom:1px solid var(--paper3);background:var(--paper);flex-shrink:0}
.ed-toprow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ed-title{font-family:'Shippori Mincho',serif;font-size:20px;color:var(--ink);border:none;background:transparent;width:100%;outline:none;line-height:1.4}
.ed-title::placeholder{color:var(--ink4)}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--paper3);background:var(--paper2);color:var(--ink2);cursor:pointer;transition:all .15s;user-select:none}
.tag.on{background:var(--accent-light);border-color:var(--accent2);color:var(--accent)}
.blocks{flex:1;overflow-y:auto;padding:14px 18px 8px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}

/* ── BLOCKS ── */
.blk{display:flex;align-items:flex-start;gap:8px;padding:5px 0;position:relative;border-radius:8px}
.blk.dot-top{border-top:2px solid var(--accent)}.blk.dot-bot{border-bottom:2px solid var(--accent)}
.blk.dragging{opacity:.4}
.bhandle{width:18px;flex-shrink:0;padding-top:6px;opacity:0;transition:opacity .15s;cursor:grab;touch-action:none}
.blk:hover .bhandle{opacity:1}
.bhandle svg{width:12px;height:12px;fill:var(--ink4)}
.bcont{flex:1;min-width:0}
.bcont input,.bcont textarea{width:100%;border:none;background:transparent;outline:none;resize:none;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);line-height:1.65}
.blk-h2 .bcont input{font-family:'Shippori Mincho',serif;font-size:18px;font-weight:500}
.blk-h3 .bcont input{font-size:15px;font-weight:500;color:var(--ink2)}
.blk-text .bcont textarea{font-size:14px}
.blk-step .bcont{display:flex;flex-direction:column;gap:0}
.blk-step .bcont .step-row{display:flex;gap:9px;align-items:flex-start}
.blk-step .bcont .step-row textarea{font-size:14px;flex:1;border:none;background:transparent;outline:none;resize:none;line-height:1.65;font-family:'Zen Kaku Gothic New',sans-serif}
.blk-step .step-extras{padding-left:33px;display:flex;flex-direction:column;gap:2px}
.snum{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px;cursor:pointer;transition:transform .1s}
.snum:hover{transform:scale(1.15)}
.blk-note .bcont{background:var(--warm-light);border-left:3px solid var(--warm);padding:9px 12px}
.blk-note .bcont textarea{font-size:13px;color:var(--ink2)}
.blk-img-wrap{margin-top:6px;position:relative;display:inline-block}
.blk-img-wrap img{max-width:100%;max-height:200px;border-radius:8px;display:block;object-fit:contain}
.blk-img-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;line-height:1}
.blk-img-add{margin-top:6px;padding:4px 10px;border-radius:8px;border:1px dashed var(--paper3);background:transparent;color:var(--ink3);font-size:11px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;display:inline-flex;align-items:center;gap:4px}
.blk-img-add:hover{border-color:var(--accent2);color:var(--accent)}
.ref-badge{display:inline-flex;align-items:center;gap:3px;background:var(--accent-light);border:1px solid var(--accent2);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--accent);cursor:pointer;margin:2px 2px 0 0;user-select:none}
.ref-badge:hover{background:var(--accent);color:#fff}
.ref-num{font-weight:600;font-size:13px;line-height:1}
.ref-label{font-size:10px;opacity:.8;max-width:80px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ref-del{opacity:.5;font-size:12px;margin-left:2px;line-height:1}
.ref-del:hover{opacity:1}
.ref-section{margin-top:6px;display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.ref-add-btn{font-size:10px;color:var(--ink3);background:none;border:1px dashed var(--paper3);border-radius:20px;padding:2px 8px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif}
.ref-add-btn:hover{border-color:var(--accent2);color:var(--accent)}
.bdel{position:absolute;right:-2px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--paper3);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;color:var(--ink3);line-height:1;transition:all .15s}
.blk:hover .bdel{display:flex}
.bdel:hover{background:var(--coral-light);color:var(--danger)}
.bbar{display:flex;gap:5px;padding:9px 15px;background:var(--paper);border-top:1px solid var(--paper3);overflow-x:auto;flex-shrink:0}
.bbar::-webkit-scrollbar{display:none}
.bbtn{flex-shrink:0;padding:7px 12px;border-radius:9px;border:1px solid var(--paper3);background:var(--paper2);font-size:12px;color:var(--ink2);cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;white-space:nowrap}
.bbtn:active{background:var(--accent-light);border-color:var(--accent2);color:var(--accent)}

/* ── EXPORT ── */
.exp-scroll{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.exp-scroll::-webkit-scrollbar{width:3px}
.sec-h{font-family:'Shippori Mincho',serif;font-size:17px;color:var(--ink);margin-bottom:10px}
.cover-preview{width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:1px solid var(--paper3)}
.cover-preview canvas{width:100%;height:100%;display:block}
.thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.thumb{aspect-ratio:3/4;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;position:relative;transition:border-color .2s}
.thumb.on{border-color:var(--accent)}
.thumb canvas{width:100%;height:100%;display:block}
.thumb-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.42);color:#fff;font-size:9px;text-align:center;padding:3px 0}
.photo-drop{border:2px dashed var(--paper3);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:var(--paper2);transition:all .2s}
.photo-drop:active{border-color:var(--accent2);background:var(--accent-light)}
.photo-drop p{font-size:13px;color:var(--ink3);margin-top:7px}
.photo-drop p.sub{font-size:11px;margin-top:3px}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.cdot{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .2s,transform .15s}
.cdot.on{border-color:var(--ink);transform:scale(1.1)}
.exp-btn{padding:14px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:16px;cursor:pointer;width:100%}
.exp-btn:active{background:var(--accent2)}
.exp-btn:disabled{background:var(--ink4);cursor:default}
.pdf-msg{font-size:12px;color:var(--accent);text-align:center;min-height:18px}

/* ── ADMIN ── */
.admin-scroll{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.admin-user-card{background:var(--paper);border:1px solid var(--paper3);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.admin-user-card .uname{flex:1;font-size:14px;font-weight:500;color:var(--ink)}
.admin-user-card .urole{font-size:11px;color:var(--ink3);background:var(--paper2);padding:2px 8px;border-radius:20px}
.admin-del-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--paper3);background:transparent;font-size:12px;color:var(--ink3);cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif}
.admin-del-btn:hover{border-color:var(--coral);color:var(--danger);background:var(--coral-light)}
.admin-del-btn:disabled{opacity:.4;cursor:default}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal-bg.hidden{display:none}
.modal{background:var(--paper);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:430px;max-height:65vh;display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:'Shippori Mincho',serif;font-size:16px;color:var(--ink)}
.modal-list{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.modal-item{padding:10px 14px;border-radius:10px;border:1px solid var(--paper3);cursor:pointer;font-size:13px;color:var(--ink);background:var(--paper2);display:flex;align-items:center;gap:8px}
.modal-item:hover{background:var(--accent-light);border-color:var(--accent2)}
.modal-item .mnum{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-cancel{padding:10px;border-radius:10px;border:none;background:var(--paper3);cursor:pointer;font-size:14px;color:var(--ink2);font-family:'Zen Kaku Gothic New',sans-serif}

/* ── BOTTOM NAV ── */
.bnav{background:var(--paper);border-top:1px solid var(--paper3);display:flex;padding:14px 0 calc(var(--safe-bottom)+18px);flex-shrink:0}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 0;color:var(--ink3);transition:color .15s;border:none;background:none;font-family:'Zen Kaku Gothic New',sans-serif}
.nitem.on{color:var(--accent)}
.nitem svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nitem span{font-size:10px;letter-spacing:.03em}
.sync-msg{font-size:11px;color:var(--ink3);text-align:center;padding:4px 0;flex-shrink:0}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="logo-mark">▲</span>てびき</div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="save-toast" id="toast">保存しました</span>
    <div class="user-chip" id="user-chip" style="display:none">
      <span id="user-name-lbl"></span>
      <button id="logout-btn">ログアウト</button>
    </div>
  </div>
</div>

<div class="screens">

  <!-- AUTH -->
  <div class="screen active" id="sc-auth">
    <div class="auth-wrap">
      <div class="auth-logo"><span>▲</span>てびき<small>いつでもどこでもサクッとマニュアルを</small></div>
      <div class="auth-tabs">
        <div class="auth-tab on" id="tab-login" onclick="switchTab('login')">ログイン</div>
        <div class="auth-tab" id="tab-register" onclick="switchTab('register')">新規登録</div>
      </div>
      <!-- LOGIN -->
      <div class="auth-form" id="form-login">
        <div><div class="field-lbl">ユーザー名</div><input class="field-inp" id="login-user" placeholder="username" autocomplete="username"></div>
        <div><div class="field-lbl">パスワード</div><input class="field-inp" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
        <div class="auth-err" id="login-err"></div>
        <button class="auth-btn" id="login-btn">ログイン</button>
      </div>
      <!-- REGISTER -->
      <div class="auth-form hidden" id="form-register">
        <div><div class="field-lbl">ユーザー名</div><input class="field-inp" id="reg-user" placeholder="username（半角英数字）" autocomplete="username"></div>
        <div><div class="field-lbl">パスワード</div><input class="field-inp" id="reg-pass" type="password" placeholder="8文字以上" autocomplete="new-password"></div>
        <div><div class="field-lbl">パスワード（確認）</div><input class="field-inp" id="reg-pass2" type="password" placeholder="••••••••" autocomplete="new-password"></div>
        <div class="auth-err" id="reg-err"></div>
        <div class="auth-ok" id="reg-ok"></div>
        <button class="auth-btn" id="reg-btn">登録する</button>
      </div>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen" id="sc-home">
    <div class="home-hero">
      <div class="home-greet" id="home-greet">今日も、ひとつ書いておこう</div>
      <div class="home-title">あなたの<em>てびき</em>集</div>
    </div>
    <button class="new-btn" id="new-btn">
      <span class="new-btn-plus">+</span>
      <div style="text-align:left">
        <div style="font-weight:500">新しいてびきを作る</div>
        <div class="new-btn-sub">コーヒーの淹れ方から、通勤ルートまで</div>
      </div>
    </button>
    <div class="sync-msg" id="sync-msg"></div>
    <div class="section-lbl">保存済みのてびき</div>
    <div class="manual-list" id="manual-list"></div>
  </div>

  <!-- EDITOR -->
  <div class="screen" id="sc-editor">
    <div class="ed-header">
      <div class="ed-toprow">
        <button class="icon-btn" id="ed-back"><svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg></button>
        <input class="ed-title" id="ed-title" placeholder="タイトルをつける..." autocomplete="off">
        <button id="to-export" style="padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:20px;font-size:12px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;white-space:nowrap">PDF出力</button>
      </div>
      <div class="tag-row" id="tag-row">
        <span class="tag" data-v="料理・食事">料理・食事</span>
        <span class="tag" data-v="移動・外出">移動・外出</span>
        <span class="tag" data-v="家事">家事</span>
        <span class="tag" data-v="趣味">趣味</span>
        <span class="tag" data-v="仕事">仕事</span>
        <span class="tag" data-v="その他">その他</span>
      </div>
    </div>
    <div class="blocks" id="blocks"></div>
    <div class="bbar">
      <button class="bbtn" data-t="step">＋ ステップ</button>

async function sb(method,table,body,query=''){
  const headers={
    'apikey':SB_KEY,
    'Authorization':'Bearer '+SB_KEY,
    'Content-Type':'application/json',
  };
  if(method==='POST') headers['Prefer']='return=representation,resolution=merge-duplicates';
  const res=await fetch(`${SB_URL}/rest/v1/${table}${query}`,{
    method,headers,
    body:body?JSON.stringify(body):undefined
  });
  if(!res.ok){const e=await res.text();throw new Error(e)}
  const txt=await res.text();
  return txt?JSON.parse(txt):null;
}

/* SHA-256 ハッシュ */
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ═══ 楽観的ロック ═══ */
let curBaseUpdatedAt=null; /* 編集開始時点のupdated_at（競合検出の基準） */

class ConflictError extends Error{
  constructor(dbTs){super('conflict');this.dbTs=dbTs}
}

async function upsertManual(m,force=false){
  if(!force && curBaseUpdatedAt){
    const rows=await sb('POST','rpc/get_manual_updated_at',{p_id:m.id,p_user_id:currentUser.id});
    if(rows&&rows.length){
      const dbTs=new Date(rows[0].updated_at).getTime();
      if(dbTs>curBaseUpdatedAt) throw new ConflictError(dbTs);
    }
  }
  await sb('POST','rpc/upsert_manual',{
    p_id:m.id,p_user_id:currentUser.id,
    p_title:m.title,p_tags:m.tags,p_blocks:m.blocks,
    p_updated_at:new Date(m.updatedAt).toISOString()
  });
  curBaseUpdatedAt=m.updatedAt;
}

async function handleConflict(m,dbTs){
  const dbTime=new Date(dbTs).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const choice=confirm(
    '⚠️ 競合が検出されました\n\n'+
    '別のデバイスで '+dbTime+' に保存されています。\n\n'+
    '【OK】自分の編集内容で上書き保存する\n'+
    '【キャンセル】最新データを読み込む（自分の編集は失われます）'
  );
  if(choice){
    m.updatedAt=Date.now();
    await upsertManual(m,true);
    const t=document.getElementById('toast');t.textContent='上書き保存しました';flashToast();
  }else{
    await loadManuals();
    const latest=getM(m.id);
    if(latest){
      curBaseUpdatedAt=latest.updatedAt;
      document.getElementById('ed-title').value=latest.title||'';
      document.querySelectorAll('.tag').forEach(t=>t.classList.toggle('on',(latest.tags||[]).includes(t.dataset.v)));
      renderBlocks(latest.blocks||[]);
    }
    const t=document.getElementById('toast');t.textContent='最新データを読み込みました';flashToast();
  }
}

  await sb('POST','rpc/delete_manual',{p_id:id,p_user_id:currentUser.id});
}

function flashToast(){const t=document.getElementById('toast');t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}
function ago(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return'たった今';if(s<3600)return Math.floor(s/60)+'分前';
  if(s<86400)return Math.floor(s/3600)+'時間前';
  if(s<86400*30)return Math.floor(s/86400)+'日前';
  const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()}`;
}
const CC=['','c1','c2'];

  const list=document.getElementById('manual-list');list.innerHTML='';
  if(!manuals.length){list.innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div>まだてびきがありません<br>上のボタンから作ってみましょう</div>`;return}

/* ═══ EDITOR ═══ */
let curId=null,saveTimer=null;
function schedSave(){clearTimeout(saveTimer);saveTimer=setTimeout(autoSave,800)}

function collectBlocks(){
  return[...document.querySelectorAll('#blocks .blk')].map(el=>{
    const inp=el.querySelector('input,textarea');
    const imgs=[...el.querySelectorAll('.blk-img-wrap img')].map(i=>i.src).filter(Boolean);

async function autoSave(){
  const m=getM(curId);if(!m||!currentUser)return;
  m.title=document.getElementById('ed-title').value;
  m.tags=[...document.querySelectorAll('.tag.on')].map(t=>t.dataset.v);

    t.textContent='保存しました';t.style.color='';
    flashToast();
  }catch(e){
    if(e instanceof ConflictError){
      /* 競合 → ユーザーに選ばせる */
      await handleConflict(m,e.dbTs);
    }else{
      console.error('autoSave error',e);
      const t=document.getElementById('toast');
      t.textContent='保存失敗 ('+e.message.slice(0,30)+')';
      t.style.color='var(--danger)';
      flashToast();
      setTimeout(()=>{t.textContent='保存しました';t.style.color=''},3000);
    }

}

/* ═══ BLOCKS ═══ */
let stepCnt=0;
function renderBlocks(blocks){
  const area=document.getElementById('blocks');area.innerHTML='';stepCnt=0;
  blocks.forEach(b=>area.appendChild(mkBlk(b)));
  initDnD();
  setTimeout(()=>area.querySelectorAll('textarea').forEach(el=>ar(el)),50);
}
function addBlock(type){
  const id='b'+Date.now();
  const el=mkBlk({id,type,val:'',imgs:[],refs:[]});
  document.getElementById('blocks').appendChild(el);
  initDnD();schedSave();
  setTimeout(()=>{const inp=el.querySelector('input,textarea');if(inp){ar(inp);inp.focus()}},10);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function ar(el){if(!el)return;el.style.height='auto';el.style.height=Math.max(el.scrollHeight,24)+'px'}
function renum(){let n=0;document.querySelectorAll('#blocks .blk[data-type="step"] .snum').forEach(e=>e.textContent=++n)}

function mkBlk(b){
  const d=document.createElement('div');
  d.className='blk blk-'+b.type;d.dataset.id=b.id;d.dataset.type=b.type;
  const handle=`<div class="bhandle"><svg viewBox="0 0 10 16"><circle cx="3" cy="3" r="1.5"/><circle cx="7" cy="3" r="1.5"/><circle cx="3" cy="8" r="1.5"/><circle cx="7" cy="8" r="1.5"/><circle cx="3" cy="13" r="1.5"/><circle cx="7" cy="13" r="1.5"/></svg></div>`;
  const del=`<button class="bdel">×</button>`;

  if(b.type==='h2'){
    d.innerHTML=`${handle}<div class="bcont"><input placeholder="見出し"></div>${del}`;
  }else if(b.type==='h3'){
    d.innerHTML=`${handle}<div class="bcont"><input placeholder="小見出し"></div>${del}`;
  }else if(b.type==='text'){
    d.innerHTML=`${handle}<div class="bcont"><textarea placeholder="テキストを入力..."></textarea></div>${del}`;
  }else if(b.type==='step'){
    stepCnt++;
    d.innerHTML=`${handle}<div class="bcont"><div class="step-row"><div class="snum">${stepCnt}</div><textarea placeholder="手順を書く..."></textarea></div><div class="step-extras"></div></div>${del}`;
  }else if(b.type==='note'){
    d.innerHTML=`${handle}<div class="bcont"><textarea placeholder="メモ・注意点..."></textarea></div>${del}`;
  }

  /* ★ value/textContent はDOMで設定（XSS対策） */
  const inp=d.querySelector('input,textarea');
  if(inp){
    if(inp.tagName==='INPUT') inp.value=b.val||'';
    else inp.textContent=b.val||'';
  }

  const extras=d.querySelector('.step-extras')||d.querySelector('.bcont');

  /* ④ 既存画像を複数表示（imgs配列、後方互換でimgも対応） */
  const imgList=b.imgs||(b.img?[b.img]:[]);
  imgList.forEach(url=>{if(url)extras.appendChild(mkImgWrap(url))});

  const addImgBtn=document.createElement('button');
  addImgBtn.className='blk-img-add';addImgBtn.innerHTML='📷 写真を追加';
  addImgBtn.onclick=()=>openBlkPhoto(d,addImgBtn);
  extras.appendChild(addImgBtn);

  const refSec=document.createElement('div');refSec.className='ref-section';
  (b.refs||[]).forEach(refId=>refSec.appendChild(mkRefBadge(refId)));
  const refAddBtn=document.createElement('button');
  refAddBtn.className='ref-add-btn';refAddBtn.textContent='＋ 参照を追加';
  refAddBtn.onclick=()=>openRefPicker(d,refSec);
  refSec.appendChild(refAddBtn);
  extras.appendChild(refSec);

  if(inp){inp.addEventListener('input',()=>{ar(inp);schedSave()});if(inp.tagName==='TEXTAREA')ar(inp)}
  d.querySelector('.bdel').onclick=()=>{d.remove();renum();schedSave()};
  return d;
}

/* 画像ラッパー要素を生成 */
function mkImgWrap(url){
  const iw=document.createElement('div');iw.className='blk-img-wrap';
  const img=document.createElement('img');img.src=url;
  const delBtn=document.createElement('button');delBtn.className='blk-img-del';delBtn.textContent='×';
  delBtn.onclick=async()=>{
    await deleteImageFromStorage(url);
    iw.remove();schedSave();
  };
  iw.appendChild(img);iw.appendChild(delBtn);
  return iw;
}

const CIRCLED='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function circled(n){return n<=20?CIRCLED[n-1]:`(${n})`}
function renumRefs(blkEl){
  blkEl.querySelectorAll('.ref-badge').forEach((badge,i)=>{
    badge.dataset.refNum=String(i+1);
    const ns=badge.querySelector('.ref-num');if(ns)ns.textContent=circled(i+1);
    const ls=badge.querySelector('.ref-label');if(ls)updateRefLabel(ls,badge.dataset.refId);
  });
}
function mkRefBadge(refId){
  const badge=document.createElement('span');
  badge.className='ref-badge';badge.dataset.refId=refId;badge.dataset.refNum='1';
  badge.title='タップでジャンプ・長押しで番号をコピー';
  const numSpan=document.createElement('span');numSpan.className='ref-num';numSpan.textContent=circled(1);

/* ランダム文字列生成（32文字の16進数） */
function randomHex(){
  const arr=new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function uploadImageToStorage(file){
  const ext=file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'jpg')||'jpg';
  /* ユーザーID / タイムスタンプ_ランダム32文字.拡張子 */
  const path=`${currentUser.id}/${Date.now()}_${randomHex()}.${ext}`;
  const res=await fetch(`${SB_URL}/storage/v1/object/tebiki-images/${path}`,{
    method:'POST',
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Content-Type':file.type||'image/jpeg',
      'x-upsert':'true'
    },
    body:file
  });
  if(!res.ok){const e=await res.text();throw new Error('画像アップロード失敗: '+e)}
  return `${SB_URL}/storage/v1/object/public/tebiki-images/${path}`;
}

async function deleteImageFromStorage(url){
  if(!url||!url.includes('tebiki-images'))return;
  const path=url.split('/tebiki-images/')[1];
  if(!path)return;
  await fetch(`${SB_URL}/storage/v1/object/tebiki-images/${path}`,{
    method:'DELETE',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  }).catch(()=>{}); /* 削除失敗は無視 */
}

/* ═══ DRAG & DROP ═══ */
let dnd=null;
function initDnD(){
  document.querySelectorAll('.bhandle').forEach(h=>{h.onmousedown=e=>startDrag(e,'mouse');h.ontouchstart=e=>startDrag(e,'touch')});
}
function startDrag(e,mode){
  e.preventDefault();const blk=e.currentTarget.closest('.blk');if(!blk)return;
  dnd={blk,mode};blk.classList.add('dragging');
  if(mode==='mouse'){document.onmousemove=onDrag;document.onmouseup=endDrag}
  else{document.ontouchmove=e2=>{e2.preventDefault();onDrag(e2)};document.ontouchend=endDrag}
}
function clientY(e){return e.touches?e.touches[0].clientY:e.clientY}
function onDrag(e){
  if(!dnd)return;const cy=clientY(e);
  const sibs=[...document.querySelectorAll('#blocks .blk:not(.dragging)')];
  sibs.forEach(s=>s.classList.remove('dot-top','dot-bot'));
  let tgt=null,pos='after';
  for(const s of sibs){const r=s.getBoundingClientRect();if(cy<r.top+r.height/2){tgt=s;pos='before';break}tgt=s;pos='after'}
  if(tgt)tgt.classList.add(pos==='before'?'dot-top':'dot-bot');
  dnd.tgt=tgt;dnd.pos=pos;
}
function endDrag(){
  if(!dnd)return;const{blk,tgt,pos}=dnd;blk.classList.remove('dragging');
  document.querySelectorAll('.blk').forEach(s=>s.classList.remove('dot-top','dot-bot'));
  if(tgt&&tgt!==blk){const area=document.getElementById('blocks');if(pos==='before')area.insertBefore(blk,tgt);else tgt.after(blk)}
  renum();
  document.querySelectorAll('#blocks .blk').forEach(blkEl=>{
    blkEl.querySelectorAll('.ref-badge').forEach(badge=>{
      const ls=badge.querySelector('.ref-label');if(ls)updateRefLabel(ls,badge.dataset.refId);
    });
    renumRefs(blkEl);
  });
  schedSave();
  document.onmousemove=document.onmouseup=null;document.ontouchmove=document.ontouchend=null;dnd=null;
}

function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function hexAlpha(hex,a){const[r,g,b]=h2r(hex);return`rgba(${r},${g},${b},${a})`}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath()}
function tick(){return new Promise(r=>setTimeout(r,20))}
function wrapText(ctx,text,maxW){if(!text)return[''];const lines=[];let cur='';for(const ch of text){if(ch==='\n'){lines.push(cur);cur='';continue}if(ctx.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch}else cur+=ch}lines.push(cur);return lines.length?lines:[''] }
/* 画像をBlobとして取得してからObjectURLに変換（Canvas汚染防止） */
function loadImg(src){
  return new Promise(async res=>{
    if(!src){res(null);return}
    try{
      let objectUrl=src;
      /* StorageのURLはfetchでBlobに変換してCORSを回避 */
      if(src.startsWith('http')){
        const r=await fetch(src,{headers:{'apikey':SB_KEY}});
        if(!r.ok){res(null);return}
        const blob=await r.blob();
        objectUrl=URL.createObjectURL(blob);
      }
      const img=new Image();
      img.onload=()=>res(img);
      img.onerror=()=>res(null);
      img.src=objectUrl;
    }catch{res(null)}
  });
}

      const imgs_t=b.imgs||(b.img?[b.img]:[]);
      for(const src of imgs_t){const img=await loadImg(src);if(img){const iw=Math.min(img.width,CW),ih=img.height*(iw/img.width);ctx.drawImage(img,MX,y+blockH,iw,ih);blockH+=ih+20}}
      if(b.refs&&b.refs.length){ctx.font=`400 40px 'Zen Kaku Gothic New',sans-serif`;ctx.fillStyle=pal.accent;ctx.textBaseline='top';ctx.fillText(buildRefText(b.refs),MX,y+blockH);blockH+=60}
      y+=blockH;
    }else if(b.type==='note'){
      ctx.font=`400 52px 'Zen Kaku Gothic New',sans-serif`;
      const imgs_n=b.imgs||(b.img?[b.img]:[]);
      const wrapped=wrapText(ctx,b.val||'',CW-56);let bh=Math.max(120,wrapped.length*76)+48;
      /* note の画像高さを事前に加算 */
      for(const src of imgs_n){const img=await loadImg(src);if(img){const iw=Math.min(img.width,CW-56);bh+=img.height*(iw/img.width)+20}}
      ctx.fillStyle=hexAlpha(pal.deco,.15);roundRect(ctx,MX,y,CW,bh,12);ctx.fill();
      ctx.fillStyle=pal.accent;ctx.fillRect(MX,y,12,bh);
      ctx.fillStyle=pal.sub;ctx.textBaseline='top';wrapped.forEach((line,i)=>ctx.fillText(line,MX+40,y+28+i*72));
      let noteY=y+28+wrapped.length*72+20;
      for(const src of imgs_n){const img=await loadImg(src);if(img){const iw=Math.min(img.width,CW-56),ih=img.height*(iw/img.width);ctx.drawImage(img,MX+40,noteY,iw,ih);noteY+=ih+20}}
      y+=bh+28;
    }
  }
  ctx.fillStyle=pal.accent;ctx.fillRect(MX,H-120,CW,4);
  ctx.font=`400 44px 'Zen Kaku Gothic New',sans-serif`;ctx.fillStyle=pal.sub;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('▲  てびき',W/2,H-96);ctx.textAlign='left';
  return c.toDataURL('image/jpeg',.95);
}

/* 画像の実際の描画高さを計算（Canvasの幅に合わせてスケール） */
async function measureImgH(src, maxW){
  if(!src) return 0;
  try{
    const img = await loadImg(src);
    if(!img) return 0;
    const iw = Math.min(img.width, maxW);
    return Math.round(img.height * (iw / img.width)) + 20; /* +20 は余白 */
  }catch{return 0}
}

async function paginateBlocks(blocks){
  const MAX=3160;
  const CW=2480-160*2; /* renderPage と同じ計算 */

  /* 各ブロックの高さを非同期で計算 */
  const heights = await Promise.all(blocks.map(async b=>{
    const textMaxW = b.type==='step' ? CW-104 : b.type==='note' ? CW-56 : CW;
    /* テキスト行数を大まかに推定（Canvasなしなので文字数ベース） */
    const charsPerLine = b.type==='step' ? 18 : b.type==='note' ? 22 : 24;
    const lineH = b.type==='step' ? 84 : b.type==='note' ? 76 : 80;
    const imgUrls=b.imgs||(b.img?[b.img]:[]);
    let imgH=0;
    for(const src of imgUrls){imgH+=await measureImgH(src,textMaxW)}
    const refH=(b.refs&&b.refs.length)?60:0;
    if(b.type==='h2') return 140;
    if(b.type==='h3') return 100;
    if(b.type==='step') return Math.max(112, Math.ceil((b.val||'').length/charsPerLine)*lineH+28) + imgH + refH;
    if(b.type==='text') return Math.ceil((b.val||'').length/charsPerLine)*lineH+28 + imgH + refH;
    if(b.type==='note') return Math.max(148, Math.ceil((b.val||'').length/charsPerLine)*lineH+76) + imgH;
    return 80;
  }));

  const pages=[];let cur=[];let h=0;
  blocks.forEach((b,i)=>{
    const bh=heights[i];
    /* 1ブロックがMAXを超える場合は単独ページに */
    if(h+bh>MAX && cur.length){pages.push(cur);cur=[];h=0}
    cur.push(b);h+=bh;
  });
  if(cur.length)pages.push(cur);
  let sn=0;pages.forEach(pg=>{pg._stepOffset=sn;pg.forEach(b=>{if(b.type==='step')sn++})});
  return pages.length?pages:[[]];
}

async function genPDF(){
  const m=getM(curId);if(!m)return;
  const btn=document.getElementById('pdf-btn'),msg=document.getElementById('pdf-msg');
  btn.disabled=true;msg.textContent='PDFを生成しています...';
  try{
    await tick();const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const PW=210,PH=297;const pal=PALETTES[selColor];
    msg.textContent='表紙を描画中...';await tick();
    const cc=document.createElement('canvas');cc.width=2480;cc.height=3508;
    renderCover(cc,selCover,selColor,m.title||'てびき');
    doc.addImage(cc.toDataURL('image/jpeg',.95),'JPEG',0,0,PW,PH);
    msg.textContent='本文を組版中...';await tick();
    const pages=await paginateBlocks(m.blocks||[]);
    for(let i=0;i<pages.length;i++){
      doc.addPage();
      const imgData=await renderPage(pal,i===0?(m.title||'てびき'):null,i===0?(m.tags||[]):null,pages[i],pages[i]._stepOffset);
      doc.addImage(imgData,'JPEG',0,0,PW,PH);await tick();
    }
    doc.addPage();
    const bc=document.createElement('canvas');bc.width=2480;bc.height=3508;
    const bx=bc.getContext('2d');bx.fillStyle=pal.accent;bx.fillRect(0,0,2480,3508);
    const rr=rng(123);for(let i=0;i<14;i++)drawLeaf(bx,rr()*2480,rr()*3508,180+rr()*180,rr()*Math.PI*2,'rgba(255,255,255,.2)');
    bx.globalAlpha=.12;bx.font='bold 780px sans-serif';bx.fillStyle='#fff';bx.textAlign='center';bx.textBaseline='middle';bx.fillText('▲',1240,1680);bx.globalAlpha=1;
    bx.font=`500 130px 'Zen Kaku Gothic New',sans-serif`;bx.fillStyle='rgba(255,255,255,.9)';bx.fillText('▲  てびき',1240,2940);
    doc.addImage(bc.toDataURL('image/jpeg',.95),'JPEG',0,0,PW,PH);
    msg.textContent='ダウンロード中...';await tick();
    doc.save((m.title||'tebiki').replace(/[^\w\u3000-\u9FFF]/g,'_')+'_tebiki.pdf');
    msg.textContent='ダウンロード完了！';setTimeout(()=>{msg.textContent=''},3000);
  }catch(err){console.error(err);msg.textContent='エラー: '+err.message}
  finally{btn.disabled=false}
}
